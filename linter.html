<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegiTile | Document Linter Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        .leg-navy { background-color: #002e5d; }
        .text-leg-navy { color: #002e5d; }
        
        /* This styles the raw HTML that Mammoth extracts so it is readable */
        #document-output p { margin-bottom: 1rem; line-height: 1.6; }
        #document-output strong { font-weight: 900; }
    </style>
</head>
<body class="bg-slate-50 h-screen font-sans text-slate-800 flex flex-col">

    <header class="shrink-0 pt-8 pb-4 px-10 z-40 bg-white border-b border-slate-200 flex justify-between items-end">
        <div>
            <h1 class="text-2xl font-black text-slate-800 uppercase tracking-tight">Linter Parsing Sandbox</h1>
            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mt-1">Upload a .docx to extract clean HTML</p>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-10 flex gap-8">
        <div class="w-1/3">
            <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center">
                <div class="mb-4">
                    <svg class="mx-auto h-12 w-12 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
                <h2 class="text-lg font-black text-leg-navy mb-2">Select a Bill Document</h2>
                <p class="text-sm text-slate-500 mb-6">Only Microsoft Word (.docx) files are supported for extraction.</p>
                
                <input type="file" id="upload" accept=".docx" class="hidden" />
                <label for="upload" class="cursor-pointer bg-[#002e5d] hover:bg-[#001f3f] text-white text-[12px] font-black uppercase px-6 py-3 rounded-lg shadow-sm transition block">
                    Browse Files
                </label>
            </div>
            
            <div id="status-panel" class="mt-4 p-4 rounded-lg bg-slate-100 border border-slate-200 hidden">
                <span class="text-xs font-bold text-slate-600 uppercase tracking-wider block mb-1">Status:</span>
                <span id="status-text" class="text-sm font-black text-leg-navy">Ready</span>
            </div>
        </div>

        <div class="w-2/3 bg-white p-10 rounded-xl shadow-sm border border-slate-200 overflow-y-auto h-full">
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100 pb-2 mb-6">Extracted Document View</h3>
            <div id="document-output" class="text-sm text-slate-700">
                <p class="text-slate-400 italic text-center mt-20">The extracted text will appear here.</p>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('upload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusPanel = document.getElementById('status-panel');
            const statusText = document.getElementById('status-text');
            const outputDiv = document.getElementById('document-output');

            statusPanel.classList.remove('hidden');
            statusText.innerText = "Parsing document...";
            statusText.className = "text-sm font-black text-orange-600";
            
            outputDiv.innerHTML = '<p class="text-slate-400 italic text-center mt-20 animate-pulse">Running extraction engine...</p>';

            const reader = new FileReader();
            
            reader.onload = function(loadEvent) {
                const arrayBuffer = loadEvent.target.result;

                // Pass the raw file data to mammoth
                mammoth.convertToHtml({arrayBuffer: arrayBuffer})
                    .then(function(result) {
                        // Render the clean HTML
                        outputDiv.innerHTML = result.value;
                        
                        // Handle any warnings Mammoth encountered (like unrecognized Word styles)
                        if(result.messages.length > 0) {
                            console.warn("Mammoth warnings:", result.messages);
                            statusText.innerText = "Parsed with minor formatting warnings.";
                            statusText.className = "text-sm font-black text-orange-600";
                        } else {
                            statusText.innerText = "Extraction complete.";
                            statusText.className = "text-sm font-black text-green-600";
                        }
                    })
                    .catch(function(err) {
                        console.error(err);
                        outputDiv.innerHTML = `<p class="text-red-500 font-bold">Error extracting text: ${err.message}</p>`;
                        statusText.innerText = "Extraction failed.";
                        statusText.className = "text-sm font-black text-red-600";
                    });
            };

            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
