<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteTile - Participant Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-6 min-h-screen">

    <main class="max-w-3xl mx-auto">
        <div id="view-login" class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 mt-10 max-w-md mx-auto space-y-6">
            <div class="text-center">
                <h1 class="text-2xl font-bold tracking-tight text-indigo-900">Conference Selection</h1>
                <p class="text-sm text-slate-500 mt-2">Enter your name to join the voting session.</p>
            </div>
<div class="space-y-4">
                <input type="text" id="voter-name-input" placeholder="First and Last Name" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-indigo-500 text-sm">
                
                <select id="voter-workgroup-input" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-indigo-500 text-sm bg-white">
                    <option value="" disabled selected>Select your work group...</option>
                    <option value="CRO">CRO</option>
                    <option value="HADM">HADM</option>
                    <option value="HDC">HDC</option>
                    <option value="HRC">HRC</option>
                    <option value="LA">LA</option>
                    <option value="Leg-Tech">Leg-Tech</option>
                    <option value="LSS">LSS</option>
                    <option value="OPR">OPR</option>
                    <option value="SADM">SADM</option>
                    <option value="SCS">SCS</option>
                    <option value="SDC">SDC</option>
                    <option value="SRC">SRC</option>
                </select>

                <button onclick="joinSession()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition-colors cursor-pointer">Join Session</button>
            </div>

        <div id="view-portal" class="hidden space-y-6">
            <header class="bg-indigo-900 text-white p-4 md:p-6 rounded-xl shadow-md flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Voter Dashboard</h1>
                    <p class="text-xs text-indigo-200 mt-1" id="welcome-text">Welcome back</p>
                    <div id="group-badge" class="mt-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-indigo-800/50 text-indigo-100 uppercase tracking-wider hidden">
                        Group: <span id="group-name" class="ml-1 text-white">None</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <span id="badge-gate" class="px-3 py-1 bg-indigo-800 rounded-full text-xs font-bold border border-indigo-700">Checking...</span>
                    <span id="badge-round" class="px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full text-xs font-bold">Round --</span>
                </div>
            </header>

            <div id="alert-locked" class="hidden bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-lg shadow-sm">
                <h3 class="text-amber-800 font-bold text-sm">Polls are currently closed</h3>
                <p class="text-xs text-amber-700 mt-1">The administrator has paused submissions.</p>
            </div>

            <div id="voting-canvas" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 min-h-[400px]">
                <div id="sync-status" class="text-center py-10 text-slate-400 text-sm font-medium animate-pulse">Syncing with system...</div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = "https://votetile-api.ewing-jacob.workers.dev";
        let myVoterId = localStorage.getItem('votetile_voter_id');
        let myVoterName = localStorage.getItem('votetile_voter_name');
        
        let myR1Votes = JSON.parse(localStorage.getItem(`votetile_r1_${myVoterId}`)) || {};
        let myR2Votes = JSON.parse(localStorage.getItem(`votetile_r2_${myVoterId}`)) || {};
        
        let currentState = { round: '1', gate: 'open', limits: 0, published: 'false', hash: '' };
        let activeTopics = [], myGroupFeed = [], finalResultsData = null, finalGroupResults = null;
        let isReadyState = false;
        let syncTimer;
        
        window.addEventListener('DOMContentLoaded', () => {
            if (myVoterId && myVoterName) { showPortal(); startEngine(); } 
            else { document.getElementById('view-login').classList.remove('hidden'); }
        });

async function joinSession() {
            const nameInput = document.getElementById('voter-name-input').value.trim();
            const workgroupInput = document.getElementById('voter-workgroup-input').value;
            
            if (!nameInput) return alert("Please enter your name.");
            if (!workgroupInput) return alert("Please select your work group.");
            
            try {
                const res = await fetch(`${API_URL}/api/voter/join`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ name: nameInput, workgroup: workgroupInput }) 
                });
                const data = await res.json();
                
                myVoterId = data.voterId; 
                myVoterName = data.name;
                localStorage.setItem('votetile_voter_id', myVoterId); 
                localStorage.setItem('votetile_voter_name', myVoterName);
                
                // Clear any old session votes
                myR1Votes = {}; myR2Votes = {};
                
                showPortal(); 
                startEngine();
            } catch (err) { 
                alert("Failed to connect to voting server."); 
            }
        }

        function showPortal() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-portal').classList.remove('hidden');
            document.getElementById('welcome-text').innerText = `Participant: ${escapeHtml(myVoterName)}`;
        }

        function startEngine() { 
            runSyncLoop(); 
        }

        async function runSyncLoop() {
            if (myVoterId) {
                await syncData();
            }
            
            // Adaptive Polling: 1 Second Active Mode
            let timerSpeed = 1000; 

            if (currentState.gate === 'closed') {
                timerSpeed = 15000; // Idle mode: 15 seconds
            }
            if (currentState.published === 'true') {
                timerSpeed = 60000; // Sleep mode: 1 minute
            }

            syncTimer = setTimeout(runSyncLoop, timerSpeed);
        }

        async function syncData() {
            try {
                const res = await fetch(`${API_URL}/api/voter/sync`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ voterId: myVoterId })
                });
                
                if (!res.ok) throw new Error("Sync API failed");
                const data = await res.json();
                
                currentState = data.state;
                activeTopics = data.topics;
                myGroupFeed = data.groupFeed || [];
                finalResultsData = data.finalResults;

                if (currentState.published === 'true' && currentState.round === '2' && !finalGroupResults) {
                    const groupRes = await fetch(`${API_URL}/api/admin/group-results`);
                    finalGroupResults = await groupRes.json();
                } else if (currentState.published !== 'true') {
                    finalGroupResults = null;
                }

                if (data.voter) {
                    isReadyState = data.voter.status === `ready_r${currentState.round}`;
                    const groupBadge = document.getElementById('group-badge');
                    if (data.voter.group_id && data.voter.group_id !== 'unassigned') {
                        groupBadge.classList.remove('hidden');
                        document.getElementById('group-name').innerText = escapeHtml(data.voter.group_id);
                    } else {
                        groupBadge.classList.add('hidden');
                    }
                }

                const serverHash = currentState.hash || 'default';
                const localHash = localStorage.getItem('votetile_session_hash');
                if (localHash && localHash !== serverHash) {
                    localStorage.clear(); 
                    location.reload(); 
                    return;
                }
                localStorage.setItem('votetile_session_hash', serverHash);

                updateUI();
            } catch (err) {
                console.error("Sync payload error:", err);
                clearTimeout(syncTimer); // Kills the engine if internet drops
                const canvas = document.getElementById('voting-canvas');
                if (canvas) {
                    canvas.innerHTML = `
                        <div class="text-center py-10">
                            <div class="text-rose-600 font-bold mb-4">Network Disconnect</div>
                            <button onclick="location.reload()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-lg text-sm shadow-sm transition-colors cursor-pointer">Force Retry</button>
                        </div>`;
                }
            }
        }

        function updateUI() {
            document.getElementById('badge-gate').innerText = currentState.gate === 'open' ? '🟢 Polls Open' : '🔒 Polls Closed';
            document.getElementById('badge-round').innerText = `Phase ${currentState.round}`;
            const lockAlert = document.getElementById('alert-locked'), canvas = document.getElementById('voting-canvas');

            if (currentState.gate === 'closed' && currentState.published !== 'true') {
                lockAlert.classList.remove('hidden'); canvas.classList.add('opacity-60', 'pointer-events-none');
            } else {
                lockAlert.classList.add('hidden'); canvas.classList.remove('opacity-60', 'pointer-events-none');
            }

            if (currentState.published === 'true') renderPublishedResults();
            else if (currentState.round === '1') renderRound1();
            else renderRound2();
        }

        function appendReadyButton(html) {
            return html + `<button onclick="toggleReady()" class="mt-6 w-full ${isReadyState ? 'bg-green-600 hover:bg-green-700' : 'bg-slate-800 hover:bg-slate-900'} text-white font-bold py-3 rounded-lg shadow-sm cursor-pointer transition-colors">
                ${isReadyState ? '✅ I am Done Voting' : 'Mark as Ready'}
            </button>`;
        }

        window.toggleReady = async function() {
            isReadyState = !isReadyState;
            localStorage.setItem(`votetile_ready_r${currentState.round}_${myVoterId}`, isReadyState);
            updateUI();
            await fetch(`${API_URL}/api/voter/ready`, { 
                method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ voterId: myVoterId, isReady: isReadyState, round: currentState.round }) 
            });
        }

        function renderRound1() {
            const canvas = document.getElementById('voting-canvas');
            if (activeTopics.length === 0) return canvas.innerHTML = `<p class="text-center text-slate-500 py-8">Waiting for topics...</p>`;
            let html = `<div class="mb-6 border-b border-slate-100 pb-4"><h2 class="text-lg font-bold text-slate-800">Quality Filter (Yes/No)</h2></div><div class="space-y-3">`;

            activeTopics.forEach(topic => {
                const myChoice = myR1Votes[topic.topic_id];
                const yesClass = myChoice === 'yes' ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-emerald-50';
                const noClass = myChoice === 'no' ? 'bg-rose-600 text-white border-rose-600 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-rose-50';
                html += `<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 bg-slate-50 border border-slate-200 rounded-lg gap-3"><span class="text-sm font-semibold text-slate-700 flex-1">${escapeHtml(topic.title)}</span><div class="flex gap-2 w-full sm:w-auto"><button onclick="castBinaryVote('${topic.topic_id}', 'yes')" class="flex-1 sm:flex-initial px-6 py-2 text-xs font-bold rounded-md transition-colors border cursor-pointer ${yesClass}">Yes</button><button onclick="castBinaryVote('${topic.topic_id}', 'no')" class="flex-1 sm:flex-initial px-6 py-2 text-xs font-bold rounded-md transition-colors border cursor-pointer ${noClass}">No</button></div></div>`;
            });
            html += `</div>`;
            html = appendReadyButton(html);
            if (canvas.innerHTML !== html) canvas.innerHTML = html;
        }

        async function castBinaryVote(topicId, value) {
            if (currentState.gate === 'closed') return;
            myR1Votes[topicId] = value; localStorage.setItem(`votetile_r1_${myVoterId}`, JSON.stringify(myR1Votes)); renderRound1();
            await fetch(`${API_URL}/api/vote/round1`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ voterId: myVoterId, topicId, value }) });
        }

        function renderRound2() {
            const canvas = document.getElementById('voting-canvas');
            const limit = parseInt(currentState.limits) || 0;
            const spentTokens = Object.values(myR2Votes).reduce((sum, val) => sum + (parseInt(val) || 0), 0);
            
            let trackerHtml = limit > 0 ? `<div class="p-3 rounded-lg border border-slate-200 ${limit - spentTokens < 0 ? 'text-red-600 bg-red-50' : 'text-indigo-700 bg-indigo-50'} font-bold text-sm text-center mb-4">Your Tokens Remaining: ${limit - spentTokens} / ${limit}</div>` : `<div class="p-3 rounded-lg border border-slate-200 bg-slate-50 font-bold text-sm text-center mb-4 text-slate-600">Total Tokens Spent: ${spentTokens}</div>`;

            let html = `<div class="mb-6 border-b border-slate-100 pb-4"><h2 class="text-lg font-bold text-slate-800">Team Priority Ranking</h2></div>${trackerHtml}<div class="space-y-3">`;

            activeTopics.forEach(topic => {
                const groupTotal = myGroupFeed.find(f => f.topic_id === topic.topic_id)?.total_tokens || 0;
                const myTokens = myR2Votes[topic.topic_id] || 0;
                html += `<div class="flex flex-col md:flex-row justify-between items-start md:items-center p-4 bg-white border border-slate-200 rounded-xl gap-4 shadow-sm"><div class="flex-1"><span class="text-sm font-bold text-slate-800 block">${escapeHtml(topic.title)}</span><div class="mt-1.5 inline-flex items-center gap-1.5 text-xs text-slate-500 font-medium bg-slate-50 px-2 py-1 rounded border border-slate-100">Group Total: <span class="font-bold text-indigo-600 text-sm">${groupTotal}</span></div></div><div class="flex items-center gap-1 bg-slate-100 p-1.5 rounded-lg border border-slate-200 shrink-0 w-full md:w-auto justify-between"><label class="text-[10px] font-bold text-slate-400 uppercase tracking-wide mx-2 hidden md:block">My Allocation</label><div class="flex items-center gap-1"><button onclick="adjustTokens('${topic.topic_id}', -1)" class="w-8 h-8 flex items-center justify-center bg-white hover:bg-slate-50 border border-slate-300 rounded text-slate-600 font-bold cursor-pointer shadow-sm">-</button><input type="number" onchange="setTokens('${topic.topic_id}', this.value)" value="${myTokens}" min="0" class="w-14 h-8 text-center text-sm font-bold text-indigo-900 border border-slate-300 rounded focus:outline-indigo-500 bg-white"><button onclick="adjustTokens('${topic.topic_id}', 1)" class="w-8 h-8 flex items-center justify-center bg-white hover:bg-slate-50 border border-slate-300 rounded text-slate-600 font-bold cursor-pointer shadow-sm">+</button></div></div></div>`;
            });
            html += `</div>`;
            html = appendReadyButton(html);
            if (canvas.innerHTML !== html) canvas.innerHTML = html;
        }

        function adjustTokens(topicId, delta) { setTokens(topicId, (myR2Votes[topicId] || 0) + delta); }

        async function setTokens(topicId, newVal) {
            if (currentState.gate === 'closed') return;
            let val = Math.max(0, parseInt(newVal) || 0);
            const limit = parseInt(currentState.limits) || 0;
            if (limit > 0) {
                const spentOnOthers = Object.keys(myR2Votes).filter(id => id !== topicId).reduce((sum, id) => sum + (myR2Votes[id] || 0), 0);
                if (spentOnOthers + val > limit) { val = limit - spentOnOthers; alert(`Limit reached. You only have ${limit} tokens.`); }
            }
            myR2Votes[topicId] = val; localStorage.setItem(`votetile_r2_${myVoterId}`, JSON.stringify(myR2Votes)); renderRound2();
            
            fetch(`${API_URL}/api/vote/round2`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ voterId: myVoterId, topicId, tokens: val }) }); 
        }

        function renderPublishedResults() {
            const canvas = document.getElementById('voting-canvas');
            if (!finalResultsData || activeTopics.length === 0) return;
            const isRound1 = currentState.round === '1';

            const sortedTopics = [...activeTopics].map(topic => {
                const r1 = finalResultsData.round1.find(r => r.topic_id === topic.topic_id) || { yes_count: 0, no_count: 0 };
                const r2 = finalResultsData.round2.find(r => r.topic_id === topic.topic_id) || { total_tokens: 0 };
                return { ...topic, yes_count: r1.yes_count, no_count: r1.no_count, total_tokens: r2.total_tokens };
            }).sort((a, b) => isRound1 ? b.yes_count - a.yes_count : b.total_tokens - a.total_tokens || b.yes_count - a.yes_count);

            let html = `<div class="mb-6 text-center"><h2 class="text-2xl font-bold text-indigo-900 mb-2">🎉 Phase ${isRound1 ? '1' : '2'} Results</h2></div><div class="space-y-3">`;
            
            sortedTopics.forEach((topic, index) => {
                const rankColor = index === 0 ? 'bg-amber-100 text-amber-800 border-amber-200' : index === 1 ? 'bg-slate-200 text-slate-700 border-slate-300' : index === 2 ? 'bg-orange-100 text-orange-800 border-orange-200' : 'bg-slate-50 text-slate-500 border-slate-200';
                
                const scoreHtml = isRound1 
                    ? `<div class="text-sm font-bold text-emerald-600">👍 ${topic.yes_count}</div><div class="text-sm font-bold text-rose-600">👎 ${topic.no_count}</div>`
                    : `<div class="text-lg font-black text-indigo-600">${topic.total_tokens} <span class="text-[10px] text-slate-400 font-normal uppercase tracking-wide">Tokens</span></div>`;

                html += `<div class="flex items-center p-4 bg-white border border-slate-200 rounded-xl gap-4 shadow-sm"><div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm border ${rankColor} shrink-0">#${index + 1}</div><span class="text-sm font-bold text-slate-800 flex-1">${escapeHtml(topic.title)}</span><div class="text-right flex flex-col items-end justify-center">${scoreHtml}</div></div>`;
            });
            html += `</div>`;

            if (!isRound1 && finalGroupResults) {
                html += `<div class="mt-10 mb-4 border-b border-slate-200 pb-2"><h3 class="text-lg font-bold text-slate-800">Top 5 Topics by Group</h3></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
                const groups = [...new Set(finalGroupResults.map(item => item.group_id))];
                groups.forEach(g => {
                    if (g === 'unassigned') return;
                    const top5 = finalGroupResults.filter(i => i.group_id === g).slice(0, 5);
                    html += `<div class="p-4 bg-slate-50 rounded-xl border border-slate-200"><h4 class="font-bold text-sm mb-3 text-indigo-800 uppercase tracking-wider">${escapeHtml(g)}</h4>`;
                    top5.forEach((t, idx) => { html += `<div class="text-xs py-1.5 border-b border-slate-200 flex justify-between"><span class="truncate pr-2">${idx+1}. ${escapeHtml(t.title)}</span><span class="font-bold text-indigo-600 shrink-0">${t.total_tokens}</span></div>`; });
                    html += `</div>`;
                });
                html += `</div>`;
            }

            if (canvas.innerHTML !== html) canvas.innerHTML = html;
        }

        function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : ''; }
    </script>
</body>
</html>
