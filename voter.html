<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteTile - Participant Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-6 min-h-screen">

    <main class="max-w-3xl mx-auto">
        
        <!-- ================= VIEW 1: LOGIN SCREEN ================= -->
        <div id="view-login" class="bg-white p-8 rounded-xl shadow-xs border border-slate-200 mt-10 max-w-md mx-auto space-y-6">
            <div class="text-center">
                <h1 class="text-2xl font-bold tracking-tight text-indigo-900">Conference Selection</h1>
                <p class="text-sm text-slate-500 mt-2">Enter your name to join the voting session.</p>
            </div>
            
            <div class="space-y-4">
                <input type="text" id="voter-name-input" placeholder="First and Last Name" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-indigo-500 text-sm">
                <button onclick="joinSession()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition-colors cursor-pointer">
                    Join Session
                </button>
            </div>
        </div>

        <!-- ================= VIEW 2: ACTIVE PORTAL ================= -->
        <div id="view-portal" class="hidden space-y-6">
            
            <!-- Header Bar -->
            <header class="bg-indigo-900 text-white p-4 md:p-6 rounded-xl shadow-md flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Voter Dashboard</h1>
                    <p class="text-xs text-indigo-200 mt-1" id="welcome-text">Welcome back, Participant</p>
                </div>
                <div class="flex gap-2">
                    <span id="badge-gate" class="px-3 py-1 bg-indigo-800 rounded-full text-xs font-bold border border-indigo-700">Checking Status...</span>
                    <span id="badge-round" class="px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full text-xs font-bold">Round --</span>
                </div>
            </header>

            <!-- Locked Screen Warning -->
            <div id="alert-locked" class="hidden bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-lg shadow-xs">
                <h3 class="text-amber-800 font-bold text-sm">Polls are currently closed</h3>
                <p class="text-xs text-amber-700 mt-1">The administrator has paused submissions. Please wait for the next round to begin.</p>
            </div>

            <!-- Main Voting Interface Canvas -->
            <div id="voting-canvas" class="bg-white p-6 rounded-xl shadow-xs border border-slate-200 min-h-[400px]">
                <div class="text-center py-10 text-slate-400 text-sm font-medium animate-pulse">Syncing with serverless API...</div>
            </div>

        </div>

    </main>

    <script>
        const API_URL = "https://votetile-api.ewing-jacob.workers.dev";
        
        // Local Session Memory
        let myVoterId = localStorage.getItem('votetile_voter_id');
        let myVoterName = localStorage.getItem('votetile_voter_name');
        
        // Polling State Memory
        let currentState = { round: '1', gate: 'open', limits: 0 };
        let activeTopics = [];
        let myGroupFeed = [];
        
        window.addEventListener('DOMContentLoaded', () => {
            if (myVoterId && myVoterName) {
                showPortal();
                startEngine();
            } else {
                document.getElementById('view-login').classList.remove('hidden');
            }
        });

        // --- Authentication ---
        async function joinSession() {
            const nameInput = document.getElementById('voter-name-input').value.trim();
            if (!nameInput) return alert("Please enter your name.");

            try {
                const res = await fetch(`${API_URL}/api/voter/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: nameInput })
                });
                const data = await res.json();
                
                myVoterId = data.voterId;
                myVoterName = data.name;
                localStorage.setItem('votetile_voter_id', myVoterId);
                localStorage.setItem('votetile_voter_name', myVoterName);
                
                showPortal();
                startEngine();
            } catch (err) {
                alert("Failed to connect to voting server.");
            }
        }

        function showPortal() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-portal').classList.remove('hidden');
            document.getElementById('welcome-text').innerText = `Logged in as: ${escapeHtml(myVoterName)}`;
        }

        // --- Core Polling Engine ---
        function startEngine() {
            syncData();
            // Ping the Cloudflare Worker every 3 seconds to catch Admin changes instantly
            setInterval(syncData, 3000); 
        }

        async function syncData() {
            try {
                // 1. Check Admin Switches
                const statusRes = await fetch(`${API_URL}/api/status`);
                currentState = await statusRes.json();
                
                // 2. Fetch Active Topics Pool
                const topicsRes = await fetch(`${API_URL}/api/topics`);
                activeTopics = await topicsRes.json();

                // 3. If Round 2, fetch collaborative group token data
                if (currentState.round === '2') {
                    // We need to know our group ID first. Fetch the roster and find ourselves.
                    const rosterRes = await fetch(`${API_URL}/api/admin/roster`);
                    const rosterData = await rosterRes.json();
                    const me = rosterData.voters.find(v => v.voter_id === myVoterId);
                    
                    if (me && me.group_id !== 'unassigned') {
                        const feedRes = await fetch(`${API_URL}/api/feed/group`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ groupId: me.group_id })
                        });
                        myGroupFeed = await feedRes.json();
                    }
                }

                updateUI();
            } catch (err) {
                console.error("Sync error:", err);
            }
        }

        // --- Dynamic Render Pipeline ---
        function updateUI() {
            // Badges
            document.getElementById('badge-gate').innerText = currentState.gate === 'open' ? '🟢 Polls Open' : '🔒 Polls Closed';
            document.getElementById('badge-round').innerText = `Phase ${currentState.round}`;
            
            const lockAlert = document.getElementById('alert-locked');
            const canvas = document.getElementById('voting-canvas');

            if (currentState.gate === 'closed') {
                lockAlert.classList.remove('hidden');
                canvas.classList.add('opacity-50', 'pointer-events-none');
            } else {
                lockAlert.classList.add('hidden');
                canvas.classList.remove('opacity-50', 'pointer-events-none');
            }

            // Render active round logic
            if (currentState.round === '1') {
                renderRound1();
            } else {
                renderRound2();
            }
        }

        // --- Round 1: Individual Binary Selection ---
        function renderRound1() {
            const canvas = document.getElementById('voting-canvas');
            
            if (activeTopics.length === 0) {
                canvas.innerHTML = `<p class="text-center text-slate-500 py-8 text-sm">Waiting for the administrator to add topics...</p>`;
                return;
            }

            let html = `<div class="mb-6 border-b border-slate-100 pb-4">
                            <h2 class="text-lg font-bold text-slate-800">Quality Filter (Yes/No)</h2>
                            <p class="text-xs text-slate-500">Vote on every topic. You can change your answers until the polls close.</p>
                        </div>
                        <div class="space-y-3">`;

            activeTopics.forEach(topic => {
                // Determine active styling based on generic class assignment to prevent heavy DB hits on client side for MVP.
                // Note: A production system would pre-fetch user's previous votes. Here we rely on their immediate session memory.
                
                html += `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 bg-slate-50 border border-slate-200 rounded-lg gap-3">
                    <span class="text-sm font-semibold text-slate-700 flex-1">${escapeHtml(topic.title)}</span>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <button onclick="castBinaryVote('${topic.topic_id}', 'yes')" class="flex-1 sm:flex-initial px-4 py-2 bg-white border border-slate-300 hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-300 text-slate-600 text-xs font-bold rounded-md transition-colors cursor-pointer shadow-xs">Yes</button>
                        <button onclick="castBinaryVote('${topic.topic_id}', 'no')" class="flex-1 sm:flex-initial px-4 py-2 bg-white border border-slate-300 hover:bg-rose-50 hover:text-rose-700 hover:border-rose-300 text-slate-600 text-xs font-bold rounded-md transition-colors cursor-pointer shadow-xs">No</button>
                    </div>
                </div>`;
            });
            
            html += `</div>`;
            
            // Only update DOM if changes occurred to prevent screen flicker
            // A simple string comparison suffices for this footprint
            if (canvas.innerHTML !== html) canvas.innerHTML = html;
        }

        async function castBinaryVote(topicId, value) {
            if (currentState.gate === 'closed') return;
            
            // Optimistic UI could be added here, but API is fast enough.
            await fetch(`${API_URL}/api/vote/round1`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ voterId: myVoterId, topicId, value })
            });
            // Visual feedback handled purely via hover states in this iteration for simplicity
        }

        // --- Round 2: Collaborative Token Allocation ---
        function renderRound2() {
            const canvas = document.getElementById('voting-canvas');
            
            let html = `<div class="mb-6 border-b border-slate-100 pb-4">
                            <h2 class="text-lg font-bold text-slate-800">Team Priority Ranking</h2>
                            <p class="text-xs text-slate-500">Coordinate with your assigned group to distribute tokens. The leaderboard shows your group's collective total in real-time.</p>
                        </div>
                        <div class="space-y-3">`;

            activeTopics.forEach(topic => {
                // Find group total for this topic
                const groupMetric = myGroupFeed.find(f => f.topic_id === topic.topic_id);
                const groupTotal = groupMetric ? groupMetric.total_tokens : 0;

                html += `
                <div class="flex justify-between items-center p-4 bg-slate-50 border border-slate-200 rounded-lg gap-3">
                    <span class="text-sm font-semibold text-slate-700 flex-1 truncate pr-2">${escapeHtml(topic.title)}</span>
                    
                    <div class="flex items-center gap-3 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-xs shrink-0">
                        <button onclick="adjustTokens('${topic.topic_id}', -1)" class="w-6 h-6 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded text-slate-600 font-bold text-xs cursor-pointer">-</button>
                        <span class="w-8 text-center text-sm font-bold text-indigo-700">${groupTotal}</span>
                        <button onclick="adjustTokens('${topic.topic_id}', 1)" class="w-6 h-6 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded text-slate-600 font-bold text-xs cursor-pointer">+</button>
                    </div>
                </div>`;
            });
            
            html += `</div>`;
            if (canvas.innerHTML !== html) canvas.innerHTML = html;
        }

        async function adjustTokens(topicId, direction) {
            if (currentState.gate === 'closed') return;

            // To make this fully collaborative, we fetch our current personal allocation first
            // (In a full React app, this state would be held locally. Here we fetch to ensure sync)
            const currentTotalVal = myGroupFeed.find(f => f.topic_id === topicId)?.total_tokens || 0;
            const newTotal = Math.max(0, currentTotalVal + direction); // prevent negative tokens

            // Pushing the raw total up. Note: Since we don't hold personal isolated state in this minimal JS,
            // we are sending group-cumulative logic to the backend for demonstration. 
            await fetch(`${API_URL}/api/vote/round2`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ voterId: myVoterId, topicId, tokens: newTotal })
            });
            
            syncData(); // Force immediate update
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
