<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteTile - Participant Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-6 min-h-screen">

    <main class="max-w-3xl mx-auto">
        <div id="view-login" class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 mt-10 max-w-md mx-auto space-y-6">
            <div class="text-center">
                <h1 class="text-2xl font-bold tracking-tight text-indigo-900">Conference Selection</h1>
                <p class="text-sm text-slate-500 mt-2">Enter your name and workgroup to join.</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="voter-name-input" placeholder="First and Last Name" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-indigo-500 text-sm">
                
                <select id="voter-workgroup-input" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-indigo-500 text-sm bg-white">
                    <option value="" disabled selected>Select your work group...</option>
                    <option value="CRO">CRO</option>
                    <option value="HADM">HADM</option>
                    <option value="HDC">HDC</option>
                    <option value="HRC">HRC</option>
                    <option value="LA">LA</option>
                    <option value="Leg-Tech">Leg-Tech</option>
                    <option value="LSS">LSS</option>
                    <option value="OPR">OPR</option>
                    <option value="SADM">SADM</option>
                    <option value="SCS">SCS</option>
                    <option value="SDC">SDC</option>
                    <option value="SRC">SRC</option>
                </select>

                <button onclick="joinSession()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition-colors cursor-pointer">Join Session</button>
            </div>
        </div>

        <div id="view-portal" class="hidden space-y-6">
            <header class="bg-indigo-900 text-white p-4 md:p-6 rounded-xl shadow-md flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Voter Dashboard</h1>
                    <p class="text-xs text-indigo-200 mt-1" id="welcome-text">Welcome back</p>
                    <div id="group-badge" class="mt-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-indigo-800/50 text-indigo-100 uppercase tracking-wider hidden">
                        Group: <span id="group-name" class="ml-1 text-white">None</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <span id="badge-gate" class="px-3 py-1 bg-indigo-800 rounded-full text-xs font-bold border border-indigo-700">Checking...</span>
                    <span id="badge-round" class="px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full text-xs font-bold">Round --</span>
                </div>
            </header>

            <div id="alert-locked" class="hidden bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-lg shadow-sm">
                <h3 class="text-amber-800 font-bold text-sm">Polls are currently closed</h3>
                <p class="text-xs text-amber-700 mt-1">The administrator has paused submissions.</p>
            </div>

            <div id="voting-canvas" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 min-h-[400px]">
                <div id="sync-status" class="text-center py-10 text-slate-400 text-sm font-medium animate-pulse">Syncing with system...</div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = "https://votetile-api.ewing-jacob.workers.dev";
        let myVoterId = localStorage.getItem('votetile_voter_id');
        let myVoterName = localStorage.getItem('votetile_voter_name');
        
        let myR1Votes = JSON.parse(localStorage.getItem(`votetile_r1_${myVoterId}`)) || {};
        let myR2Votes = JSON.parse(localStorage.getItem(`votetile_r2_${myVoterId}`)) || {};
        let scribeSelections = JSON.parse(localStorage.getItem(`votetile_scribe_${myVoterId}`)) || {};
        
        let currentState = { round: '1', gate: 'open', limits: 0, published: 'false', hash: '' };
        let activeTopics = [], myGroupFeed = [], voterProfile = null;
        let isReadyState = false;
        let syncTimer;
        
        window.addEventListener('DOMContentLoaded', () => {
            if (myVoterId && myVoterName) { showPortal(); startEngine(); } 
            else { document.getElementById('view-login').classList.remove('hidden'); }
        });

async function joinSession() {
            const nameInput = document.getElementById('voter-name-input').value.trim();
            const workgroupInput = document.getElementById('voter-workgroup-input').value;
            
            if (!nameInput) return alert("Please enter your name.");
            if (!workgroupInput) return alert("Please select your work group.");
            
            try {
                const res = await fetch(`${API_URL}/api/voter/join`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ name: nameInput, workgroup: workgroupInput }) 
                });
                
                if (!res.ok) throw new Error("Server rejected registration.");
                
                const data = await res.json();
                
                // Store fresh session
                localStorage.setItem('votetile_voter_id', data.voterId); 
                localStorage.setItem('votetile_voter_name', data.name);
                
                myVoterId = data.voterId; 
                myVoterName = data.name;
                myR1Votes = {}; myR2Votes = {}; scribeSelections = {};
                
                showPortal(); 
                startEngine();
            } catch (err) { 
                console.error(err);
                alert("Registration failed. Please try again or contact the administrator.");
                // Ensure we don't accidentally leave ghost data
                localStorage.removeItem('votetile_voter_id');
                localStorage.removeItem('votetile_voter_name');
            }
        }

        function showPortal() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-portal').classList.remove('hidden');
            document.getElementById('welcome-text').innerText = `Participant: ${escapeHtml(myVoterName)}`;
        }

        function startEngine() { runSyncLoop(); }

        async function runSyncLoop() {
            if (myVoterId) await syncData();
            
            let timerSpeed = currentState.round === '1' ? 1000 : 2000;
            if (currentState.gate === 'closed') timerSpeed = 15000; 
            if (currentState.published === 'true') timerSpeed = 60000; 

            syncTimer = setTimeout(runSyncLoop, timerSpeed);
        }

        async function syncData() {
            try {
                const res = await fetch(`${API_URL}/api/voter/sync`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ voterId: myVoterId })
                });
                
                if (!res.ok) throw new Error("Sync API failed");
                const data = await res.json();

                // SESSION VALIDATION CHECK
                // If the user was removed from the backend, their DB record won't have an ID.
                if (!data.voter || !data.voter.voter_id) {
                    clearTimeout(syncTimer);
                    localStorage.removeItem('votetile_voter_id');
                    localStorage.removeItem('votetile_voter_name');
                    alert("Your session has been removed by the administrator. Please re-register.");
                    location.reload();
                    return;
                }
                
                currentState = data.state;
                activeTopics = data.topics;
                myGroupFeed = data.groupFeed || [];
                voterProfile = data.voter;

                if (voterProfile) {
                    isReadyState = voterProfile.status === `ready_r${currentState.round}`;
                    const groupBadge = document.getElementById('group-badge');
                    if (voterProfile.group_id && voterProfile.group_id !== 'unassigned') {
                        groupBadge.classList.remove('hidden');
                        document.getElementById('group-name').innerText = escapeHtml(voterProfile.group_id) + (voterProfile.is_scribe ? ' (SCRIBE)' : '');
                    } else {
                        groupBadge.classList.add('hidden');
                    }
                }

                updateUI();
            } catch (err) {
                console.error("Sync error:", err);
                clearTimeout(syncTimer); 
                const canvas = document.getElementById('voting-canvas');
                if (canvas) canvas.innerHTML = `<div class="text-center py-10"><div class="text-rose-600 font-bold mb-4">Network Disconnect</div><button onclick="location.reload()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-lg text-sm">Force Retry</button></div>`;
            }
        }

        function updateUI() {
            document.getElementById('badge-gate').innerText = currentState.gate === 'open' ? '🟢 Polls Open' : '🔒 Polls Closed';
            document.getElementById('badge-round').innerText = `Phase ${currentState.round}`;
            const lockAlert = document.getElementById('alert-locked'), canvas = document.getElementById('voting-canvas');

            if (currentState.gate === 'closed') {
                lockAlert.classList.remove('hidden'); canvas.classList.add('opacity-60', 'pointer-events-none');
            } else {
                lockAlert.classList.add('hidden'); canvas.classList.remove('opacity-60', 'pointer-events-none');
            }

            if (currentState.round === '1') {
                renderRound1();
            } else if (currentState.round === '2') {
                voterProfile && voterProfile.is_scribe ? renderScribeInterface() : renderObserverInterface();
            }
        }

        function appendReadyButton(html) {
            return html + `<button onclick="toggleReady()" class="mt-8 w-full ${isReadyState ? 'bg-green-600 hover:bg-green-700' : 'bg-slate-800 hover:bg-slate-900'} text-white font-bold py-3 rounded-lg shadow-sm cursor-pointer transition-colors">
                ${isReadyState ? '✅ I am Done Voting' : 'Mark as Ready'}
            </button>`;
        }

        window.toggleReady = async function() {
            isReadyState = !isReadyState;
            updateUI();
            await fetch(`${API_URL}/api/voter/ready`, { 
                method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ voterId: myVoterId, isReady: isReadyState, round: currentState.round }) 
            });
        }

        // ==========================================
        // ROUND 1: TOP 10 DRAFT
        // ==========================================
        function renderRound1() {
            const canvas = document.getElementById('voting-canvas');
            if (activeTopics.length === 0) return canvas.innerHTML = `<p class="text-center text-slate-500 py-8">Waiting for topics...</p>`;
            
            const selectedCount = Object.values(myR1Votes).filter(v => v === 'yes').length;
            const maxReached = selectedCount >= 10;

            let html = `<div class="mb-6 border-b border-slate-100 pb-4"><h2 class="text-lg font-bold text-slate-800">Select Your Top 10 Priorities</h2><p class="text-sm font-semibold ${maxReached ? 'text-green-600' : 'text-indigo-600'}">${selectedCount} / 10 Selected</p></div><div class="space-y-2">`;

            activeTopics.forEach(topic => {
                const isSelected = myR1Votes[topic.topic_id] === 'yes';
                const isDisabled = !isSelected && maxReached;
                
                html += `
                <label class="flex items-center p-3 bg-slate-50 border ${isSelected ? 'border-indigo-400 bg-indigo-50' : 'border-slate-200'} rounded-lg gap-3 ${isDisabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer hover:bg-slate-100'}">
                    <input type="checkbox" ${isSelected ? 'checked' : ''} ${isDisabled ? 'disabled' : ''} onchange="toggleR1Selection('${topic.topic_id}', this.checked)" class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500">
                    <span class="text-sm font-medium text-slate-700">${escapeHtml(topic.title)}</span>
                </label>`;
            });
            html += `</div>`;
            html = appendReadyButton(html);
            if (canvas.innerHTML !== html) canvas.innerHTML = html;
        }

        async function toggleR1Selection(topicId, isChecked) {
            if (currentState.gate === 'closed') return;
            myR1Votes[topicId] = isChecked ? 'yes' : 'no';
            localStorage.setItem(`votetile_r1_${myVoterId}`, JSON.stringify(myR1Votes));
            renderRound1();
            await fetch(`${API_URL}/api/vote/round1`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ voterId: myVoterId, topicId, value: myR1Votes[topicId] }) });
        }

        // ==========================================
        // ROUND 2: OBSERVER INTERFACE (Arrows)
        // ==========================================
        function renderObserverInterface() {
            const canvas = document.getElementById('voting-canvas');
            let html = `<div class="mb-6"><h2 class="text-lg font-bold">Group Deliberation</h2><p class="text-sm text-slate-500">Signal your support or concern for the active list.</p></div><div class="space-y-3">`;

            activeTopics.forEach(topic => {
                const mySentiment = myR2Votes[topic.topic_id] || 0;
                
                html += `
                <div class="p-4 bg-white border ${mySentiment === 1 ? 'border-green-300' : mySentiment === -1 ? 'border-red-300' : 'border-slate-200'} rounded-xl shadow-sm flex justify-between items-center gap-4">
                    <span class="text-sm font-bold text-slate-800 flex-1">${escapeHtml(topic.title)}</span>
                    <div class="flex gap-1 shrink-0">
                        <button onclick="castSentiment('${topic.topic_id}', 1)" class="px-3 py-1.5 ${mySentiment === 1 ? 'bg-green-600 text-white' : 'bg-slate-100 text-slate-500 hover:bg-green-100'} rounded-lg text-sm font-bold transition-colors">▲</button>
                        <button onclick="castSentiment('${topic.topic_id}', 0)" class="px-2 py-1.5 ${mySentiment === 0 ? 'bg-slate-300 text-slate-700' : 'bg-slate-100 text-slate-400 hover:bg-slate-200'} rounded-lg text-xs font-bold transition-colors">—</button>
                        <button onclick="castSentiment('${topic.topic_id}', -1)" class="px-3 py-1.5 ${mySentiment === -1 ? 'bg-red-600 text-white' : 'bg-slate-100 text-slate-500 hover:bg-red-100'} rounded-lg text-sm font-bold transition-colors">▼</button>
                    </div>
                </div>`;
            });
            html += `</div>`;
            html = appendReadyButton(html);
            if (canvas.innerHTML !== html) canvas.innerHTML = html;
        }

        async function castSentiment(topicId, val) {
            if (currentState.gate === 'closed') return;
            myR2Votes[topicId] = val; 
            localStorage.setItem(`votetile_r2_${myVoterId}`, JSON.stringify(myR2Votes)); 
            renderObserverInterface();
            fetch(`${API_URL}/api/vote/round2`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ voterId: myVoterId, topicId, tokens: val }) }); 
        }

        // ==========================================
        // ROUND 2: SCRIBE INTERFACE (Heat Map & Selection)
        // ==========================================
        function renderScribeInterface() {
            const canvas = document.getElementById('voting-canvas');
            
            // Sort topics by Heat Score (Descending) so Scribe sees most popular at the top
            const sortedTopics = [...activeTopics].map(topic => {
                const heat = myGroupFeed.find(f => f.topic_id === topic.topic_id)?.heat_score || 0;
                return { ...topic, heat };
            }).sort((a, b) => b.heat - a.heat);

            let html = `<div class="mb-6 p-4 bg-amber-50 border border-amber-200 rounded-lg"><h2 class="text-lg font-bold text-amber-900">✍️ Scribe Panel</h2><p class="text-sm text-amber-800">Review the group's heat map and categorize the final list.</p></div><div class="space-y-3">`;

            sortedTopics.forEach(topic => {
                const currentSelection = scribeSelections[topic.topic_id] || 'unranked';
                const heatColor = topic.heat > 0 ? 'text-green-600 bg-green-50' : topic.heat < 0 ? 'text-red-600 bg-red-50' : 'text-slate-500 bg-slate-100';
                
                html += `
                <div class="p-3 bg-white border border-slate-200 rounded-xl shadow-sm flex flex-col md:flex-row justify-between gap-3">
                    <div class="flex items-start gap-3 flex-1">
                        <div class="min-w-[40px] text-center font-black ${heatColor} px-2 py-1 rounded border border-slate-100" title="Group Heat Score">${topic.heat > 0 ? '+' : ''}${topic.heat}</div>
                        <span class="text-sm font-bold text-slate-800 pt-1">${escapeHtml(topic.title)}</span>
                    </div>
                    <select onchange="saveScribeChoice('${topic.topic_id}', this.value)" class="shrink-0 bg-slate-50 border border-slate-300 text-xs font-bold rounded p-2 focus:outline-indigo-500">
                        <option value="unranked" ${currentSelection === 'unranked' ? 'selected' : ''}>-- Categorize --</option>
                        <option value="top5" ${currentSelection === 'top5' ? 'selected' : ''}>⭐ Top 5 Priority</option>
                        <option value="alt" ${currentSelection === 'alt' ? 'selected' : ''}>🔄 Alternative</option>
                    </select>
                </div>`;
            });
            html += `</div>`;
            html = appendReadyButton(html);
            if (canvas.innerHTML !== html) canvas.innerHTML = html;
        }

        function saveScribeChoice(topicId, value) {
            scribeSelections[topicId] = value;
            localStorage.setItem(`votetile_scribe_${myVoterId}`, JSON.stringify(
