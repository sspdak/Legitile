<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteTile - Participant Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-6 min-h-screen">

    <main class="max-w-3xl mx-auto">
        <div id="view-login" class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 mt-10 max-w-md mx-auto space-y-6">
            <div class="text-center">
                <h1 class="text-2xl font-bold tracking-tight text-indigo-900">LSA Topic Selection</h1>
                <p class="text-sm text-slate-500 mt-2">Enter your name and email to join or resume your session.</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="voter-name-input" placeholder="First and Last Name" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-indigo-500 text-sm">    
                
                <input type="email" id="voter-email-input" placeholder="Work Email Address" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-indigo-500 text-sm">
                
                <select id="voter-workgroup-input" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-indigo-500 text-sm bg-white">
                    <option value="" disabled selected>Select your work group...</option>
                    <option value="CRO">CRO</option>
                    <option value="HADM">HADM</option>
                    <option value="HDC">HDC</option>
                    <option value="HRC">HRC</option>
                    <option value="LA">LA</option>
                    <option value="Leg-Tech">Leg-Tech</option>
                    <option value="LSS">LSS</option>
                    <option value="OPR">OPR</option>
                    <option value="SADM">SADM</option>
                    <option value="SCS">SCS</option>
                    <option value="SDC">SDC</option>
                    <option value="SRC">SRC</option>
                </select>

                <button id="join-btn" onclick="joinSession()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition-colors cursor-pointer shadow-sm">Join / Resume Session</button>
            </div>
        </div>

        <div id="view-portal" class="hidden space-y-6">
            <header class="bg-indigo-900 text-white p-4 md:p-6 rounded-xl shadow-md flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-xl font-bold tracking-tight">LSA Topic Selection</h1>
                    <p class="text-xs text-indigo-200 mt-1" id="welcome-text">Welcome back</p>
                    <div id="group-badge" class="mt-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-indigo-800/50 text-indigo-100 uppercase tracking-wider hidden">
                        Group: <span id="group-name" class="ml-1 text-white">None</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <span id="badge-gate" class="px-3 py-1 bg-indigo-800 rounded-full text-xs font-bold border border-indigo-700">Checking...</span>
                    <span id="badge-round" class="px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full text-xs font-bold">Phase --</span>
                </div>
            </header>

            <div id="alert-locked" class="hidden bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-lg shadow-sm">
                <h3 class="text-amber-800 font-bold text-sm">Polls are currently closed</h3>
                <p class="text-xs text-amber-700 mt-1">The administrator has paused submissions.</p>
            </div>

            <div id="voting-canvas" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 min-h-[400px]">
                <div id="sync-status" class="text-center py-10 text-slate-400 text-sm font-medium animate-pulse">Syncing with system...</div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = "https://votetile-api.ewing-jacob.workers.dev";
        let myVoterId = localStorage.getItem('votetile_voter_id');
        let myVoterName = localStorage.getItem('votetile_voter_name');
        
        let myR1Votes = JSON.parse(localStorage.getItem(`votetile_r1_${myVoterId}`)) || {};
        
        let currentState = { round: '1', gate: 'open', limits: 0, published: 'false', hash: '' };
        let activeTopics = [], groupFeed = [], scribeChoices = {}, voterProfile = null;
        let finalResultsData = null;
        let isReadyState = false, groupComplete = false;
        let syncTimer;
        
        window.addEventListener('DOMContentLoaded', () => {
            if (myVoterId && myVoterName) { showPortal(); startEngine(); } 
            else { document.getElementById('view-login').classList.remove('hidden'); }
        });

        async function joinSession() {
            const emailInput = document.getElementById('voter-email-input').value.trim();
            const nameInput = document.getElementById('voter-name-input').value.trim();
            const workgroupInput = document.getElementById('voter-workgroup-input').value;
            const joinBtn = document.getElementById('join-btn');
            
            if (!emailInput) return alert("Please enter your email address to ensure your votes are saved.");
            if (!nameInput) return alert("Please enter your name.");
            if (!workgroupInput) return alert("Please select your work group.");
            
            // UI Update: Disable the button and show a loading state
            joinBtn.disabled = true;
            joinBtn.innerText = "Joining...";
            joinBtn.classList.add('opacity-75', 'cursor-not-allowed');
            
            try {
                const res = await fetch(`${API_URL}/api/voter/join`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ email: emailInput, name: nameInput, workgroup: workgroupInput }) 
                });
                
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Server rejected registration.");
                
                myVoterId = data.voterId; 
                myVoterName = data.name;
                localStorage.setItem('votetile_voter_id', myVoterId); 
                localStorage.setItem('votetile_voter_name', myVoterName);
                
                showPortal(); 
                startEngine(); 
            } catch (err) { 
                alert(`Registration failed: ${err.message}`);
                localStorage.removeItem('votetile_voter_id');
                localStorage.removeItem('votetile_voter_name');
                
                // UI Revert: Re-enable the button if registration fails so they can try again
                joinBtn.disabled = false;
                joinBtn.innerText = "Join / Resume Session";
                joinBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }

        function showPortal() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-portal').classList.remove('hidden');
            document.getElementById('welcome-text').innerText = `Participant: ${escapeHtml(myVoterName)}`;
        }

        function startEngine() { runSyncLoop(); }

        // SMART POLLING LOGIC FOR VOTERS
        async function runSyncLoop() {
            if (myVoterId) await syncData();
            
            let timerSpeed = 5000; // Default: 5 seconds (Phase 2 deliberation)
            
            if (currentState.round === '1') {
                timerSpeed = 15000; // Phase 1 (Individual): 15 seconds
            }
            if (currentState.gate === 'closed') {
                timerSpeed = 30000; // Paused: 30 seconds
            }
            if (currentState.published === 'true') {
                timerSpeed = 60000; // Published/Finished: 60 seconds
            }
            
            syncTimer = setTimeout(runSyncLoop, timerSpeed);
        }

        async function syncData() {
            try {
                const res = await fetch(`${API_URL}/api/voter/sync`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ voterId: myVoterId })
                });
                
                if (!res.ok) throw new Error("Sync API failed");
                const data = await res.json();
                
                currentState = data.state;
                activeTopics = data.topics;
                groupFeed = data.groupFeed || [];
                scribeChoices = data.scribeChoices || {};
                groupComplete = data.groupComplete || false;
                voterProfile = data.voter;
                finalResultsData = data.finalResults;

                if (data.myR1Votes) {
                    myR1Votes = data.myR1Votes;
                    localStorage.setItem(`votetile_r1_${myVoterId}`, JSON.stringify(myR1Votes));
                }

                if (voterProfile) {
                    isReadyState = voterProfile.status === `ready_r${currentState.round}`;
                    const groupBadge = document.getElementById('group-badge');
                    if (voterProfile.group_id && voterProfile.group_id !== 'unassigned') {
                        groupBadge.classList.remove('hidden');
                        document.getElementById('group-name').innerText = escapeHtml(voterProfile.group_id) + (voterProfile.is_scribe ? ' (SCRIBE)' : '');
                    } else {
                        groupBadge.classList.add('hidden');
                    }
                }

                const serverHash = currentState.hash || 'default';
                const localHash = localStorage.getItem('votetile_session_hash');
                if (localHash && localHash !== serverHash) {
                    localStorage.clear(); location.reload(); return;
                }
                localStorage.setItem('votetile_session_hash', serverHash);

                updateUI();
            } catch (err) {
                console.error("Sync payload error:", err);
                clearTimeout(syncTimer); 
                const canvas = document.getElementById('voting-canvas');
                if (canvas) canvas.innerHTML = `<div class="text-center py-10"><div class="text-rose-600 font-bold mb-4">Network Disconnect</div><button onclick="location.reload()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-lg text-sm shadow-sm transition-colors cursor-pointer">Force Retry</button></div>`;
            }
        }

        function updateUI() {
            document.getElementById('badge-gate').innerText = currentState.gate === 'open' ? '🟢 Polls Open' : '🔒 Polls Closed';
            
            const isStraggler = currentState.round === '2' && voterProfile && voterProfile.status === 'active';
            
            document.getElementById('badge-round').innerText = isStraggler ? `Phase 1 (Catch Up)` : `Phase ${currentState.round}`;
            
            const lockAlert = document.getElementById('alert-locked'), canvas = document.getElementById('voting-canvas');

            if (currentState.gate === 'closed' && currentState.published !== 'true') {
                lockAlert.classList.remove('hidden'); canvas.classList.add('opacity-60', 'pointer-events-none');
            } else {
                lockAlert.classList.add('hidden'); canvas.classList.remove('opacity-60', 'pointer-events-none');
            }

            if (currentState.published === 'true') {
                renderPublishedResults();
            } else if (currentState.round === '1' || isStraggler) {
                renderRound1(isStraggler);
            } else if (currentState.round === '2') {
                renderRound2();
            }
        }

        window.toggleReady = async function(forcedRound = null) {
            isReadyState = !isReadyState;
            updateUI();
            
            const roundToSubmit = forcedRound || currentState.round;

            await fetch(`${API_URL}/api/voter/ready`, { 
                method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ voterId: myVoterId, isReady: isReadyState, round: roundToSubmit }) 
            });

            syncData();
        }

        // ==========================================
        // ROUND 1: INDIVIDUAL VOTES (Dynamic Limit)
        // ==========================================
        function renderRound1(isStraggler = false) {
            const canvas = document.getElementById('voting-canvas');
            if (activeTopics.length === 0) return canvas.innerHTML = `<p class="text-center text-slate-500 py-8">Waiting for topics...</p>`;
            
            const voteLimit = parseInt(currentState.limits) > 0 ? parseInt(currentState.limits) : 10;
            const selectedCount = Object.values(myR1Votes).filter(v => v === 'yes').length;
            const maxReached = selectedCount >= voteLimit;

            let html = `
            <div class="mb-6 border-b border-slate-100 pb-4 sticky top-0 bg-white/95 backdrop-blur z-10 pt-2">
                ${isStraggler ? `<div class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-2 rounded mb-3 border border-amber-200">The meeting is currently in Phase 2. Please quickly select your top choices so you can join your group's deliberation.</div>` : ''}
                <div class="flex justify-between items-end">
                    <h2 class="text-lg font-bold text-slate-800">Select Up To ${voteLimit} Topics</h2>
                    <p class="text-sm font-bold ${maxReached ? 'text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200' : 'text-indigo-600'}">${selectedCount} / ${voteLimit} Selected</p>
                </div>
            </div><div class="space-y-8">`;

            const groupedTopics = activeTopics.reduce((acc, topic) => {
                const subj = topic.subject || 'General';
                if (!acc[subj]) acc[subj] = [];
                acc[subj].push(topic);
                return acc;
            }, {});

            Object.keys(groupedTopics).sort().forEach(subject => {
                html += `<div class="space-y-2">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 ml-1">${escapeHtml(subject)}</h3>`;
                
                groupedTopics[subject].forEach(topic => {
                    const isSelected = myR1Votes[topic.topic_id] === 'yes';
                    const isDisabled = !isSelected && maxReached;
                    
                    html += `
                    <label class="flex items-start p-3 bg-slate-50 border ${isSelected ? 'border-indigo-400 bg-indigo-50 shadow-sm' : 'border-slate-200'} rounded-lg gap-3 ${isDisabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer hover:bg-slate-100 transition-colors'}">
                        <div class="pt-0.5"><input type="checkbox" ${isSelected ? 'checked' : ''} ${isDisabled ? 'disabled' : ''} onchange="toggleR1Selection('${topic.topic_id}', this.checked)" class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer"></div>
                        <span class="text-sm font-medium text-slate-700 leading-snug">${escapeHtml(topic.title)}</span>
                    </label>`;
                });
                html += `</div>`;
            });
            
            html += `</div>`;
            html += `<button onclick="toggleReady('1')" class="mt-8 w-full ${isReadyState ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-slate-800 hover:bg-slate-900'} text-white font-bold py-3 rounded-lg shadow-sm cursor-pointer transition-colors sticky bottom-4">${isReadyState ? '✅ I am Done Voting' : 'Mark as Ready'}</button>`;
            
            if (canvas.innerHTML !== html) canvas.innerHTML = html;
        }

        async function toggleR1Selection(topicId, isChecked) {
            if (currentState.gate === 'closed') return;
            myR1Votes[topicId] = isChecked ? 'yes' : 'no';
            localStorage.setItem(`votetile_r1_${myVoterId}`, JSON.stringify(myR1Votes));
            renderRound1(currentState.round === '2' && voterProfile.status === 'active');
            await fetch(`${API_URL}/api/vote/round1`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ voterId: myVoterId, topicId, value: myR1Votes[topicId] }) });
        }

        // ==========================================
        // ROUND 2: GROUP DELIBERATION (With Live Tracker)
        // ==========================================
        function renderRound2() {
            const canvas = document.getElementById('voting-canvas');
            if (!groupFeed || groupFeed.length === 0) return canvas.innerHTML = `<div class="text-center py-10 text-slate-500"><p class="font-bold">No Topics Selected</p><p class="text-sm">No one in your group selected any topics in Phase 1.</p></div>`;

            const isScribe = voterProfile && voterProfile.is_scribe === 1;

            const top5Count = Object.values(scribeChoices).filter(v => v === 'top5').length;
            const altCount = Object.values(scribeChoices).filter(v => v === 'alt').length;

            let html = `
            <div class="mb-6 border-b border-slate-100 pb-4 flex flex-col md:flex-row md:justify-between items-start md:items-end gap-4 sticky top-0 bg-white/95 backdrop-blur z-10 pt-2">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">Group Deliberation</h2>
                    <p class="text-sm text-slate-500 mt-1">${isScribe ? 'You are the Scribe. Assign the final Top 5 and Alternatives.' : 'Watch as your Scribe builds the final list.'}</p>
                </div>
                
                <div class="flex items-center gap-2 shrink-0">
                    <span class="px-3 py-1 rounded-md text-xs font-bold border ${top5Count === 5 ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : 'bg-amber-100 text-amber-800 border-amber-300'} shadow-sm transition-colors">⭐ Top 5: ${top5Count} / 5</span>
                    <span class="px-3 py-1 rounded-md text-xs font-bold border bg-blue-100 text-blue-800 border-blue-300 shadow-sm">🔄 Alts: ${altCount}</span>
                    ${groupComplete && !isScribe ? `<span class="px-3 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-md border border-emerald-300 shadow-sm">✅ Done</span>` : ''}
                </div>
            </div>
            <div class="space-y-4">`;

            const sortedFeed = [...groupFeed].sort((a, b) => {
                const catA = scribeChoices[a.topic_id] || 'unranked';
                const catB = scribeChoices[b.topic_id] || 'unranked';
                const rank = { 'top5': 1, 'alt': 2, 'unranked': 3 };
                if (rank[catA] !== rank[catB]) return rank[catA] - rank[catB];
                
                const getVoteCount = (topic) => {
                    if (topic.vote_count !== undefined) return topic.vote_count; 
                    if (Array.isArray(topic.selected_by)) return topic.selected_by.length;
                    if (typeof topic.selected_by === 'string') return topic.selected_by.split(',').filter(x => x.trim()).length;
                    return 0;
                };
                return getVoteCount(b) - getVoteCount(a);
            });

            sortedFeed.forEach(topic => {
                const currentSelection = scribeChoices[topic.topic_id] || 'unranked';
                let categoryUI = '';
                if (isScribe) {
                    const isTop5 = currentSelection === 'top5';
                    const isAlt = currentSelection === 'alt';
                    categoryUI = `
                    <div class="flex gap-2 flex-wrap justify-end mt-3 md:mt-0">
                        <button onclick="setScribeCategory('${topic.topic_id}', 'top5')" class="px-3 py-1.5 text-xs font-bold rounded-md shadow-sm transition-colors border ${isTop5 ? 'bg-amber-400 text-amber-900 border-amber-500' : 'bg-white text-slate-600 border-slate-300 hover:bg-amber-50'}">⭐ Top 5</button>
                        <button onclick="setScribeCategory('${topic.topic_id}', 'alt')" class="px-3 py-1.5 text-xs font-bold rounded-md shadow-sm transition-colors border ${isAlt ? 'bg-indigo-500 text-white border-indigo-600' : 'bg-white text-slate-600 border-slate-300 hover:bg-indigo-50'}">🔄 Alternative</button>
                        ${(isTop5 || isAlt) ? `<button onclick="setScribeCategory('${topic.topic_id}', 'unranked')" class="px-2 py-1.5 text-xs font-bold rounded-md transition-colors text-slate-400 hover:text-slate-600 hover:bg-slate-100">Clear</button>` : ''}
                    </div>`;
                } else {
                    if (currentSelection === 'top5') categoryUI = `<span class="px-3 py-1 bg-amber-100 text-amber-800 border border-amber-300 font-bold text-xs rounded-full whitespace-nowrap shadow-sm mt-2 md:mt-0 block w-fit">⭐ Top 5</span>`;
                    else if (currentSelection === 'alt') categoryUI = `<span class="px-3 py-1 bg-blue-100 text-blue-800 border border-blue-300 font-bold text-xs rounded-full whitespace-nowrap shadow-sm mt-2 md:mt-0 block w-fit">🔄 Alternative</span>`;
                    else categoryUI = `<span class="px-3 py-1 bg-slate-50 text-slate-400 border border-slate-200 font-medium text-xs rounded-full whitespace-nowrap mt-2 md:mt-0 block w-fit">Unranked</span>`;
                }

                html += `
                <div class="p-4 bg-white border ${currentSelection === 'top5' ? 'border-amber-300 bg-amber-50/30' : currentSelection === 'alt' ? 'border-blue-300 bg-blue-50/30' : 'border-slate-200'} rounded-xl shadow-sm flex flex-col md:flex-row justify-between md:items-center gap-2 transition-colors">
                    <div class="flex-1">
                        <div class="mb-1.5"><span class="px-2 py-0.5 bg-slate-100 text-slate-500 rounded border border-slate-200 text-[9px] font-bold tracking-wider uppercase">${escapeHtml(topic.subject || 'General')}</span></div>
                        <span class="text-sm font-bold text-slate-800 leading-tight block">${escapeHtml(topic.title)}</span>
                        <div class="mt-2 inline-flex items-center gap-1.5 text-[10px] text-slate-500 font-medium bg-slate-50 px-2 py-1 rounded border border-slate-200">
                            👤 Selected by: <span class="text-slate-700">${escapeHtml(topic.selected_by)}</span>
                        </div>
                    </div>
                    <div class="shrink-0">
                        ${categoryUI}
                    </div>
                </div>`;
            });
            html += `</div>`;

            if (isScribe) {
                html += `<button onclick="toggleReady('2')" class="mt-8 w-full ${isReadyState ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-slate-800 hover:bg-slate-900'} text-white font-bold py-3 rounded-lg shadow-sm cursor-pointer transition-colors sticky bottom-4">${isReadyState ? '✅ Sent to Administrator' : 'Submit Final Group List'}</button>`;
            }

            if (canvas.innerHTML !== html) canvas.innerHTML = html;
        }

        window.setScribeCategory = function(topicId, val) {
            if (val === 'top5') {
                const currentTop5Count = Object.values(scribeChoices).filter(v => v === 'top5').length;
                if (scribeChoices[topicId] !== 'top5' && currentTop5Count >= 5) {
                    alert("You can only select a maximum of 5 topics for the Top 5. Please clear another selection first.");
                    return;
                }
            }
            scribeChoices[topicId] = val;
            renderRound2(); 
            fetch(`${API_URL}/api/vote/round2`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ voterId: myVoterId, topicId, category: val }) });
        };

        // ==========================================
        // PUBLISHED RESULTS (Stacked Accordion UI Upgrade)
        // ==========================================
        function renderPublishedResults() {
            const canvas = document.getElementById('voting-canvas');
            if (!finalResultsData) return;
            const isRound1 = currentState.round === '1';

            let html = `
            <div class="mb-6 text-center border-b border-slate-100 pb-4">
                <h2 class="text-2xl font-bold text-indigo-900">🎉 Session Results Published</h2>
                <p class="text-xs text-slate-500 mt-1">Review the final tallies and group selections for this assembly.</p>
            </div>`;

            if (isRound1) {
                const sortedTopics = [...activeTopics].map(topic => {
                    const r1 = finalResultsData.round1.find(r => r.topic_id === topic.topic_id) || { yes_count: 0 };
                    return { ...topic, yes_count: r1.yes_count };
                }).sort((a, b) => b.yes_count - a.yes_count);

                html += `<div class="space-y-3 max-w-2xl mx-auto">`;
                sortedTopics.forEach((topic, index) => {
                    html += `
                    <div class="flex items-center p-4 bg-white border border-slate-200 rounded-xl gap-4 shadow-sm">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm border bg-slate-100 text-slate-600 shrink-0">#${index + 1}</div>
                        <div class="flex-1">
                            <span class="px-2 py-0.5 bg-slate-100 text-slate-500 rounded border border-slate-200 text-[9px] font-bold tracking-wider uppercase">${escapeHtml(topic.subject || 'General')}</span>
                            <span class="text-sm font-bold text-slate-800 block mt-1 leading-snug">${escapeHtml(topic.title)}</span>
                        </div>
                        <div class="text-right font-bold text-indigo-600 shrink-0">${topic.yes_count} <span class="text-[10px] text-slate-400 font-normal uppercase">Votes</span></div>
                    </div>`;
                });
                html += `</div>`;
            } else {
                
                const topicAgg = {};
                finalResultsData.round2.forEach(item => {
                    if (item.group_id === 'unassigned') return;
                    if (!topicAgg[item.topic_id]) {
                        topicAgg[item.topic_id] = { title: item.title, subject: item.subject, top5: [], alt: [] };
                    }
                    if (item.category === 'top5') topicAgg[item.topic_id].top5.push(item.group_id);
                    if (item.category === 'alt') topicAgg[item.topic_id].alt.push(item.group_id);
                });

                const rankedTopics = Object.values(topicAgg).sort((a, b) => {
                    if (b.top5.length !== a.top5.length) return b.top5.length - a.top5.length;
                    return b.alt.length - a.alt.length;
                });

                html += `<div class="space-y-4">`;

                // --- ACCORDION 1: GLOBAL CONSENSUS RANKINGS ---
                html += `
                <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                    <div class="flex justify-between items-center p-4 bg-slate-50 border-b border-slate-100 cursor-pointer group" onclick="document.getElementById('pub-global-collapse').classList.toggle('hidden'); document.getElementById('pub-global-chevron').classList.toggle('rotate-180');">
                        <div>
                            <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider flex items-center gap-2">
                                📊 Room Consensus Rankings
                            </h3>
                            <p class="text-[11px] text-slate-500 mt-0.5">Topics sorted by overall frequency across all workgroup selections.</p>
                        </div>
                        <span id="pub-global-chevron" class="text-slate-400 font-bold transition-transform duration-200">▼</span>
                    </div>
                    <div id="pub-global-collapse" class="p-4 space-y-3 bg-white">`;

                if (rankedTopics.length === 0) {
                    html += `<p class="text-slate-400 text-xs italic py-4 text-center">No group selections have been submitted yet.</p>`;
                } else {
                    rankedTopics.forEach((t, idx) => {
                        html += `
                        <div class="p-3.5 bg-slate-50/50 border border-slate-200 rounded-lg flex flex-col md:flex-row justify-between md:items-center gap-3">
                            <div class="flex-1">
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-black text-indigo-600/70">#${idx + 1}</span>
                                    <span class="px-2 py-0.5 bg-slate-100 text-slate-500 rounded border border-slate-200 text-[9px] font-bold tracking-wider uppercase">${escapeHtml(t.subject || 'General')}</span>
                                </div>
                                <span class="font-semibold text-slate-800 text-sm block mt-1.5 leading-snug">${escapeHtml(t.title)}</span>
                            </div>
                            <div class="flex flex-wrap gap-1.5 shrink-0">
                                ${t.top5.map(g => `<span class="px-2 py-0.5 bg-amber-100 text-amber-800 border border-amber-300 rounded text-[9px] font-extrabold uppercase tracking-tight">⭐ ${escapeHtml(g)}</span>`).join('')}
                                ${t.alt.map(g => `<span class="px-2 py-0.5 bg-blue-50 text-blue-700 border border-blue-200 rounded text-[9px] font-extrabold uppercase tracking-tight">🔄 ${escapeHtml(g)}</span>`).join('')}
                            </div>
                        </div>`;
                    });
                }
                html += `   </div>
                </div>`;

                // --- ACCORDION 2: DETAILED BREAKDOWN BY WORKGROUP ---
                html += `
                <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                    <div class="flex justify-between items-center p-4 bg-slate-50 border-b border-slate-100 cursor-pointer group" onclick="document.getElementById('pub-groups-collapse').classList.toggle('hidden'); document.getElementById('pub-groups-chevron').classList.toggle('rotate-180');">
                        <div>
                            <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider flex items-center gap-2">
                                📋 Workgroup Submissions Breakdown
                            </h3>
                            <p class="text-[11px] text-slate-500 mt-0.5">Granular look at the individual Top 5 and Alternative sheets submitted by caucus, staff, or assistants.</p>
                        </div>
                        <span id="pub-groups-chevron" class="text-slate-400 font-bold transition-transform duration-200">▼</span>
                    </div>
                    <div id="pub-groups-collapse" class="p-4 bg-white hidden">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;

                const groups = [...new Set(finalResultsData.round2.map(item => item.group_id))];
                
                if (groups.length === 0) {
                    html += `<p class="text-slate-400 text-xs italic py-4 text-center col-span-2">Waiting for group registries to finalize sheets...</p>`;
                } else {
                    groups.forEach(g => {
                        if (g === 'unassigned') return;
                        
                        const groupData = finalResultsData.round2.filter(i => i.group_id === g);
                        const top5 = groupData.filter(i => i.category === 'top5');
                        const alts = groupData.filter(i => i.category === 'alt');

                        html += `<div class="p-4 bg-slate-50 border border-slate-200 rounded-xl flex flex-col justify-between">
                                    <div>
                                        <h4 class="font-extrabold text-xs mb-3 text-indigo-900 border-b border-indigo-100 pb-1.5 uppercase tracking-widest">${escapeHtml(g)}</h4>`;
                        
                        if (top5.length > 0) {
                            html += `<div class="mb-4"><span class="text-[10px] font-black text-amber-700 uppercase tracking-wider block mb-1">⭐ Top Priority Drafts</span><ul class="space-y-1">`;
                            top5.forEach(t => html += `<li class="text-xs font-semibold text-slate-800 leading-snug pl-2 border-l-2 border-amber-400">${escapeHtml(t.title)}</li>`);
                            html += `</ul></div>`;
                        }
                        if (alts.length > 0) {
                            html += `<div><span class="text-[10px] font-black text-blue-700 uppercase tracking-wider block mb-1">🔄 Secondary Alternatives</span><ul class="space-y-1">`;
                            alts.forEach(t => html += `<li class="text-xs font-medium text-slate-600 leading-snug pl-2 border-l-2 border-blue-300">${escapeHtml(t.title)}</li>`);
                            html += `</ul></div>`;
                        }
                        if (top5.length === 0 && alts.length === 0) {
                            html += `<p class="text-xs text-slate-400 italic">Deliberation list is blank.</p>`;
                        }
                        html += `   </div>
                                 </div>`;
                    });
                }
                html += `       </div>
                            </div>
                </div>`;

                html += `</div>`; 
            }

            if (canvas.innerHTML !== html) canvas.innerHTML = html;
        }

        function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : ''; }
    </script>
</body>
</html>
