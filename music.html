<!DOCTYPE html>
<html>
<head>
  <title>NPR Archive</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    select { padding: 10px; font-size: 16px; margin: 10px; min-width: 250px; }
    button { background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; padding: 10px 15px; font-size: 16px; margin: 5px; }
    #result-area { margin-top: 20px; display: none; background: #f4f4f4; padding: 20px; border-radius: 8px; max-width: 600px; margin-left: auto; margin-right: auto; }
    input[type="text"] { width: 90%; padding: 10px; font-size: 14px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .btn-copy { background: #28a745; }
    .meta-text { color: #555; font-size: 14px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <h1>NPR Playlist Archive</h1>
  <p>Select a saved Friday snapshot to load the playlist.</p>
  
  <select id="episode-select">
    <option value="">Loading archives...</option>
  </select>

  <div id="result-area">
    <div id="track-count" class="meta-text"></div>
    <p><strong>Your Playlist Link:</strong></p>
    <input type="text" id="queue-url" readonly>
    <br>
    <button id="copy-btn" class="btn-copy">Copy Link</button>
    <button id="open-btn">Open in YouTube</button>
  </div>

  <script>
    const WORKER_URL = 'https://npr-converter.ewing-jacob.workers.dev/';
    
    const select = document.getElementById('episode-select');
    const resultArea = document.getElementById('result-area');
    const queueUrlInput = document.getElementById('queue-url');
    const trackCountDiv = document.getElementById('track-count');
    const copyBtn = document.getElementById('copy-btn');
    const openBtn = document.getElementById('open-btn');

    let archiveData = [];

    window.onload = async () => {
      try {
        const response = await fetch(`${WORKER_URL}?action=list`);
        const data = await response.json();
        
        if (data.episodes && data.episodes.length > 0) {
          archiveData = data.episodes;
          select.innerHTML = '<option value="">-- Choose a week --</option>';
          
          archiveData.forEach((ep, index) => {
            const option = document.createElement('option');
            option.value = index; 
            option.text = ep.title;
            select.appendChild(option);
          });
        } else {
          select.innerHTML = '<option>No archives found yet.</option>';
        }
      } catch (error) {
        select.innerHTML = '<option>Error loading database.</option>';
      }
    };

    select.onchange = () => {
      if (select.value === "") {
        resultArea.style.display = 'none';
        return;
      }
      
      const selectedEp = archiveData[select.value];
      trackCountDiv.innerText = `Tracks saved: ${selectedEp.trackCount}`;
      queueUrlInput.value = selectedEp.youtubeQueueUrl;
      resultArea.style.display = 'block';
    };

    copyBtn.onclick = () => {
      queueUrlInput.select();
      navigator.clipboard.writeText(queueUrlInput.value);
      copyBtn.innerText = "Copied!";
      setTimeout(() => copyBtn.innerText = "Copy Link", 2000);
    };

// 4. Handle the Open Button
    openBtn.onclick = () => {
      // Intercept the standard link and swap the domain to YouTube Music
      const ytmUrl = queueUrlInput.value.replace('www.youtube.com', 'music.youtube.com');
      window.open(ytmUrl, '_blank');
    };
  </script>
</body>
</html>
