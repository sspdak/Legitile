<!DOCTYPE html>
<html>
<head>
  <title>NPR to YouTube</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    select, button { padding: 10px; font-size: 16px; margin: 10px; }
    button { background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:disabled { background: #cccccc; cursor: not-allowed; }
    #status { margin-top: 20px; color: gray; }
    #result-area { margin-top: 20px; display: none; background: #f4f4f4; padding: 20px; border-radius: 8px; max-width: 600px; margin-left: auto; margin-right: auto; }
    input[type="text"] { width: 90%; padding: 10px; font-size: 14px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .btn-copy { background: #28a745; }
  </style>
</head>
<body>

  <h1>New Music Friday Converter</h1>
  <p>Select an episode below to generate a YouTube playlist link.</p>
  
  <select id="episode-select">
    <option>Loading available episodes...</option>
  </select>
  <br>
  <button id="convert-btn" disabled>Find Songs</button>
  <div id="status"></div>

  <!-- This area stays hidden until a link is successfully generated -->
  <div id="result-area">
    <p><strong>Your Playlist Link:</strong></p>
    <input type="text" id="queue-url" readonly>
    <br>
    <button id="copy-btn" class="btn-copy">Copy Link</button>
    <button id="open-btn">Open in YouTube</button>
  </div>

  <script>
    // Your live Worker URL is permanently wired in here
    const WORKER_URL = 'https://npr-converter.ewing-jacob.workers.dev/';
    
    const select = document.getElementById('episode-select');
    const button = document.getElementById('convert-btn');
    const status = document.getElementById('status');
    const resultArea = document.getElementById('result-area');
    const queueUrlInput = document.getElementById('queue-url');
    const copyBtn = document.getElementById('copy-btn');
    const openBtn = document.getElementById('open-btn');

    // 1. Fetch the list of episodes as soon as the page loads
    window.onload = async () => {
      try {
        const response = await fetch(`${WORKER_URL}?action=list`);
        const data = await response.json();
        
        select.innerHTML = ''; // Clear the "Loading..." text
        data.episodes.forEach(ep => {
          const option = document.createElement('option');
          option.value = ep.title;
          option.text = `${ep.title} (${ep.date})`;
          select.appendChild(option);
        });
        button.disabled = false;
      } catch (error) {
        select.innerHTML = '<option>Error loading episodes. Check Cloudflare Worker.</option>';
      }
    };

    // 2. Handle the "Find Songs" button click
    button.onclick = async () => {
      const selectedTitle = select.value;
      button.disabled = true;
      button.innerText = "Working... (this takes a few seconds)";
      status.innerText = "Reading episode notes and searching YouTube...";
      resultArea.style.display = 'none';
      
      try {
        const response = await fetch(`${WORKER_URL}?action=convert&title=${encodeURIComponent(selectedTitle)}`); 
        const data = await response.json();
        
        if (data.error) throw new Error(data.error);

        status.innerText = `Success! Found ${data.trackCount} albums.`;
        queueUrlInput.value = data.youtubeQueueUrl;
        resultArea.style.display = 'block'; // Reveal the link and buttons
      } catch (error) {
        status.innerText = `Error: ${error.message}`;
      }
      
      button.innerText = "Find Songs";
      button.disabled = false;
    };

    // 3. Handle the Copy Button
    copyBtn.onclick = () => {
      queueUrlInput.select();
      navigator.clipboard.writeText(queueUrlInput.value);
      copyBtn.innerText = "Copied!";
      setTimeout(() => copyBtn.innerText = "Copy Link", 2000); // Reset text after 2 seconds
    };

    // 4. Handle the Open Button
    openBtn.onclick = () => {
      window.open(queueUrlInput.value, '_blank');
    };
  </script>
</body>
</html>
